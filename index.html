<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- phones: no pinch / double-tap zoom on the game; the canvas reaches the notch's edge -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Dreamcatcher</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Phaser's FIT + autoCenter sizes and centres the canvas in the body */
        /* touch screens: no page scroll, bounce, zoom or long-press selection */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        image-rendering: pixelated;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
